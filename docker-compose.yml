# 使用前：cp backend/.env.example backend/.env 并按 docs/LOCAL_SETUP.md 填写密钥。
services:
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    env_file:
      - backend/.env
    environment:
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      STOCKVIEW_DATA_DIR: /app/data # 容器内唯一数据根；API 与 worker 必须挂载同一卷。
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-false}
    volumes:
      - stockviewagent_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
  research-worker:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    command: ["python", "-m", "app.research_worker"]
    env_file:
      - backend/.env
    environment:
      ENABLE_RESEARCH_WORKER: ${ENABLE_RESEARCH_WORKER:-true}
      STOCKVIEW_DATA_DIR: /app/data # 搬迁持久卷时保持此容器内路径一致。
      ENABLE_SCHEDULER: "false"
      ENABLE_STARTUP_DATA_CHECK: "false"
    volumes:
      - stockviewagent_data:/app/data
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  stockviewagent_data:
